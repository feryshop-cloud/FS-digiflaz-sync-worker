name: Build and Publish FS-Digiflazz-Service Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fs-digiflazz-service

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable=true
            type=raw,value=build-${{ github.run_number }}
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: VPS-Sumopod
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DIGIFLAZZ_USERNAME: ${{ secrets.DIGIFLAZZ_USERNAME }}
          DIGIFLAZZ_API_KEY: ${{ secrets.DIGIFLAZZ_API_KEY }}
          DIGIFLAZZ_BASE_URL: ${{ secrets.DIGIFLAZZ_BASE_URL }}
          DIGIFLAZZ_MIN_RESERVE: ${{ secrets.DIGIFLAZZ_MIN_RESERVE }}
          DIGIFLAZZ_SERVICE_API_KEY: ${{ secrets.DIGIFLAZZ_SERVICE_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: DIGIFLAZZ_USERNAME,DIGIFLAZZ_API_KEY,DIGIFLAZZ_BASE_URL,DIGIFLAZZ_MIN_RESERVE,DIGIFLAZZ_SERVICE_API_KEY,SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,LOG_LEVEL
          script: |
            cd /opt/feryshop
            touch .env
            update_env() {
              local key="$1"
              local val="$2"
              if [ -n "$val" ]; then
                grep -v "^${key}=" .env > .env.tmp 2>/dev/null || true
                mv .env.tmp .env
                echo "${key}=${val}" >> .env
              fi
            }
            update_env "DIGIFLAZZ_USERNAME" "$DIGIFLAZZ_USERNAME"
            update_env "DIGIFLAZZ_API_KEY" "$DIGIFLAZZ_API_KEY"
            update_env "DIGIFLAZZ_BASE_URL" "$DIGIFLAZZ_BASE_URL"
            update_env "DIGIFLAZZ_MIN_RESERVE" "$DIGIFLAZZ_MIN_RESERVE"
            update_env "DIGIFLAZZ_SERVICE_API_KEY" "$DIGIFLAZZ_SERVICE_API_KEY"
            update_env "SUPABASE_URL" "$SUPABASE_URL"
            update_env "NEXT_PUBLIC_SUPABASE_URL" "$SUPABASE_URL"
            update_env "SUPABASE_SERVICE_ROLE_KEY" "$SUPABASE_SERVICE_ROLE_KEY"
            update_env "LOG_LEVEL" "$LOG_LEVEL"

            docker compose -f docker-compose.prod.yml pull digiflazz-service
            docker compose -f docker-compose.prod.yml up -d --no-deps digiflazz-service
            docker image prune -f

